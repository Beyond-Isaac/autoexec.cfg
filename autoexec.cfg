//-----------------------------
// OPÇÕES DE INICIALIZAÇÃO / LAUNCH OPTIONS
//-----------------------------
// -lv                // Baixa violência / Low violence
// -language english  // Interface em inglês / Interface in English
// -novid             // Remove intro / Skip intro video
// -console           // Abre console / Open console
// Exemplo / Example: -lv -novid -console

//-----------------------------
// REDE / NETWORK
//-----------------------------
rate                "100000"   // Taxa de dados / Data rate
cl_cmdrate          "100"      // Comandos por segundo / Commands per second
cl_updaterate       "100"      // Atualizações por segundo / Updates per second
cl_interp           "0.0302"   // Interpolação / Interpolation
cl_interp_ratio     "1"        // Corrigido (mínimo é 1) / Fixed (minimum is 1)

//-----------------------------
// JOGO / GAME
//-----------------------------
sv_consistency      "1"        // Consistência de arquivos / File consistency
sv_pausable         "1"        // Pausar servidor (sem efeito online) / Pause server (no effect online)
cl_forcepreload     "0"        // Pré-carregar mapas / Preload maps

//-----------------------------
// MOUSE
//-----------------------------
sensitivity         "1.4"
m_rawinput          "1"        // Entrada direta / Raw input
m_filter            "0"
m_customaccel       "0"
m_mouseaccel1       "0"
m_mouseaccel2       "0"
m_mousespeed        "0"
joystick            "0"

//-----------------------------
// ÁUDIO / AUDIO
//-----------------------------
volume              "0.14"     // Volume geral / Master volume
snd_musicvolume     "0.007"    // Música / Music
snd_mixahead        "0.08"     // Delay de áudio / Audio delay
snd_legacy_surround "1"        // Surround antigo / Legacy surround

//-----------------------------
// VOZ / VOICE
//-----------------------------
voice_enable        "1"
voice_modenable     "1"
voice_forcemicrecord "1"
voice_threshold     "1"
voice_vox           "0"

//-----------------------------
// FOV
//-----------------------------
fov_desired             "160"   // Corrigido (máx. oficial) / Fixed (official max)
cl_viewmodelfovsurvivor "100"
c_thirdpersonshoulder   "0"

//-----------------------------
// MIRA / CROSSHAIR
//-----------------------------
crosshair            "0"
cl_crosshair_alpha   "0"   // Transparência máxima / Max transparency
cl_crosshair_dynamic "0"   // Mira estática / Static crosshair

//-----------------------------
// GLOW (Infectados / Survivors)
//-----------------------------
cl_glow_infected_r   "0"   // Infectado / Infected
cl_glow_infected_g   "1"
cl_glow_infected_b   "1"

//-----------------------------
// ESPECTADOR / SPECTATOR
//-----------------------------
spec_allowroaming "1"   // Livre / Free roaming

//-----------------------------
// INFO
//-----------------------------
cl_showpos          "0"
cl_autohelp         "0"
cl_showhelp         "0"
cc_lang             "english"   // Legendas / Subtitles
cc_linger_time      "1"
cc_predisplay_time  "0"
gameinstructor_enable "0"
net_graph           "0"
net_graphpos        "2"
net_graphheight     "50"
net_graphproportionalfont "1"

//-----------------------------
// CONEXÃO / CONNECTION
//-----------------------------
sv_region           "2"   // América do Sul / South America
cl_lagcompensation  "1"
cl_timeout          "15"
con_enable          "1"
net_allow_multicast "1"
mm_dedicated_search_maxping "90"
mm_dedicated_force_servers  ""

//-----------------------------
// GRÁFICOS / GRAPHICS
//-----------------------------
mat_monitorgamma_tv_enabled "1"
mat_monitorgamma            "1.6"
mat_bloom_scalefactor_scalar "0"
mat_grain_scale_override     "0"

//-----------------------------
// FPS
//-----------------------------
fps_max                 "400"   // Corrigido / Fixed
z_wound_client_disabled "1"

//-----------------------------
// EXEC
//-----------------------------
exec binds
exec CFG_NoDeath
//exec CFG_High_Graphics

