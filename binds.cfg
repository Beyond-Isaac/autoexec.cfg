//==================================================
//   LEFT 4 DEAD 2 - BINDS
//   Autor / Author: wonder
//==================================================

unbindall   // Remove todas as binds / Clear all binds

//-----------------------------
// CONSOLE & TEAMS
//-----------------------------
bind "`" "toggleconsole"        // Abre console / Toggle console
bind "-" "jointeam 2"           // Time 2 / Team 2
bind "=" "jointeam 3"           // Time 3 / Team 3

//-----------------------------
// ARMAS / WEAPONS
//-----------------------------
bind "1" "slot1"                // Arma primária / Primary weapon
bind "2" "slot2"                // Arma secundária / Secondary weapon
bind "3" "slot3"                // Item utilitário / Utility item
bind "4" "slot4"                // Item especial / Special item
bind "x" "slot5"                // Item extra / Extra slot
bind "q" "lastinv"              // Última arma / Last weapon

//-----------------------------
// MOVIMENTO / MOVEMENT
//-----------------------------
bind "CTRL" "+duck"             // Agachar / Duck
bind "SHIFT" "+speed"           // Andar devagar / Walk
bind "SPACE" "+jump"            // Pular / Jump
bind "MWHEELUP" "+jump"         // Jump bind / Bunnyhop
bind "MWHEELDOWN" "+jump"

//-----------------------------
// AÇÕES / ACTIONS
//-----------------------------
bind "e" "+use"                 // Usar / Use
bind "r" "+reload; r_cleardecals" // Recarregar + limpar sangue / Reload + clear decals
bind "f" "+zoom"                // Zoom / Zoom
bind "g" "go_away_from_keyboard" // AFK / AFK
bind "MOUSE1" "+attack; r_cleardecals" // Atirar + limpar sangue / Shoot + clear decals
bind "MOUSE2" "+attack2; r_cleardecals" // Secundário / Secondary attack
bind "MOUSE5" ""                // Vazio / Empty

//-----------------------------
// COMUNICAÇÃO / COMMUNICATION
//-----------------------------
bind "ALT" "+voicerecord"       // Voz / Voice chat
bind "t" "impulse 201"          // Spray / Spray
bind "y" "messagemode"          // Chat público / Public chat
bind "u" "messagemode2"         // Chat time / Team chat
bind "j" "say_team GO! GO! GO!" // Mensagem rápida / Quick team message
bind "SEMICOLON" "say_team /spas"
bind "c" "say_team BACK! BACK! BACK!"

//-----------------------------
// FUNÇÕES / FUNCTIONS
//-----------------------------
bind "ESCAPE" "cancelselect"
bind "F1" "Vote Yes"
bind "F2" "Vote No"
bind "F4" "say tank, tank!"
bind "F5" "toggle volume 0.04 0.12"        // Ajuste volume / Toggle volume
bind "F6" "toggle snd_musicvolume 0.007 0.4" // Música / Toggle music volume
bind "F10" "kick Rochelle; kick Nick; kick Ellis; kick Coach; kick Zoey; kick Francis; kick Bill; kick Louis" // Apenas local / Local only
bind "i" "toggle mat_monitorgamma 2.2 1.6" // Brilho / Gamma toggle
bind "[" "sv_pausable 0"
bind "]" "sv_pausable 1"
bind "8" "sv_cheats 0"          // Apenas local / Local only
bind "9" "sv_cheats 1"          // Apenas local / Local only
bind "h" "exec autoexec.cfg"    // Executa cfg / Run cfg
bind "b" "snd_restart"          // Reinicia áudio / Restart sound
bind "l" "chooseteam"           // Escolher time / Choose team
bind "CAPSLOCK" "impulse 100"   // Lanterna / Flashlight
bind "BACKSPACE" "disconnect"   // Sair servidor / Disconnect
bind "ENTER" "record bug; stop" // Gravar demo / Record demo

//-----------------------------
// SETAS / ARROWS
//-----------------------------
bind "UPARROW" "cl_interp 0.0302; cl_interp_ratio 1"   // Corrigido / Fixed
bind "DOWNARROW" "cl_interp 0; cl_interp_ratio 1"      // Corrigido / Fixed
bind "LEFTARROW" "+left"
bind "RIGHTARROW" "+right"

//-----------------------------
// SCRIPTS
//-----------------------------
// NULL-CANCELLING MOVEMENT + DSP
bind "W" "+mfwd; r_cleardecals"
bind "A" "+mleft; r_cleardecals"
bind "S" "+mback; r_cleardecals"
bind "D" "+mright; r_cleardecals"

alias +mfwd "dsp_volume 0;-back;+forward;alias checkfwd +forward"
alias +mback "dsp_volume 0;-forward;+back;alias checkback +back"
alias +mleft "dsp_volume 0;-moveright;+moveleft;alias checkleft +moveleft"
alias +mright "dsp_volume 0;-moveleft;+moveright;alias checkright +moveright"
alias -mfwd "-forward;checkback;alias checkfwd none"
alias -mback "-back;checkfwd;alias checkback none"
alias -mleft "-moveleft;checkright;alias checkleft none"
alias -mright "-moveright;checkleft;alias checkright none"
alias checkfwd "none"
alias checkback "none"
alias checkleft "none"
alias checkright "none"
alias none ""

// NETGRAPH
bind "TAB" "+scoregraph"
alias +scoregraph "+showscores; net_graph 4; net_graphpos 2"
alias -scoregraph "-showscores; net_graph 0"

// VIDEOMODE
bind "F11" "as_vidmd"
alias as_vidmd "as_vidmode2"
alias as_vidmode1 "mat_setvideomode 2560 1440 0; alias as_vidmd as_vidmode2"
alias as_vidmode2 "mat_setvideomode 2560 1440 1; alias as_vidmd as_vidmode1"

